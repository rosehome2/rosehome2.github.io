name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A629FE: ${{ secrets.A629FE }}
          BCC9FC: ${{ secrets.BCC9FC }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A629FE', '')
          meta_b = os.environ.get('BCC9FC', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 467ae60607e0227b21b5dbb8f13ac845da2cc4c9 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 936a45c5caefced3b3b1b887c7bf -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
